<html>
<head>
    <style>
        @font-face{font-family: fnaf; src: url("https://files.catbox.moe/zxa09k.ttf");}
    </style>
</head>
    <body style="overflow: hidden;">    <div id="cake" style="width: 30%; height: 30%; top: 80vh; left: 10vw; position: absolute; background-image: url('https://files.catbox.moe/y3lubo.png'); background-repeat: no-repeat; background-size: contain;"></div>

   <div id="cat" style="position: absolute; top: 60%; left: 80%; width: 10%; height: 10%; background-image: url('https://files.catbox.moe/mzcfhc.png'); background-repeat: no-repeat; background-size: contain;"></div>

    <div id="textbubble" style="position: absolute; top:45%; left: 65%; width: 20%; height: 20%; background-image: url('https://files.catbox.moe/lq50gv.png'); background-repeat: no-repeat; background-size: contain; opacity: 0;">
      <div id="text" style="position: absolute; top: 12%; left: 7%; width: 80%; text-align: center; font-size: 13px; font-family: fnaf; color: rgb(101, 155, 20); z-index: 100;"></div>
    </div>

    <div id="cover" style="position: absolute; top: -2000; left: 0; width: 100vw; height: 2000px; background-image: url('https://files.catbox.moe/kh3j2d.png'); background-repeat: no-repeat; background-size: cover;"></div>

    <canvas id="photo"></canvas>

     <div id="cam" style="position: absolute; top: -2000; left: 50%; width: 60%; height: 60%; background-image: url('https://files.catbox.moe/niddfm.png'); background-repeat: no-repeat; background-size: contain; transform: translate(-50%,0%);">
        <video id="camerafeed" autoplay playsinline style="width: 100%; height: 100%; object-fit: cover; pointer-events: none;"></video>
        <div id="button" style="position: absolute; top: 110%; left: 50%; width: 30% ; height: 30%; background-image: url('https://files.catbox.moe/gmugxu.png'); background-repeat: no-repeat; background-size: contain; transform: translate(-50%,0%);"></div>
     </div>

     <div id="hat" style="position: absolute; top: -1000px; left: 50%; width: 30%; height: 40%; background-image: url('https://files.catbox.moe/wuz26u.png'); background-repeat: no-repeat; background-size: contain; transform: translate(-50%,0%);"></div>

     <div id="bday_text" style="position: absolute; top: 2000px; left: 50%; width: 50%; height: 50%; background-image: url('https://files.catbox.moe/829t7m.png'); background-repeat: no-repeat; background-size: contain; transform: translate(-50%,0%);"></div>

    <div id="startsc" style="position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; background-color: rgb(0, 0, 0); opacity: 0.9;"></div>

    <button  id="startbut" style="width: 10vw; height: 5vw; position: absolute; top: 50%; left: 50%; color: black; font-size:20px; font-family: fnaf; transform: translate(-50%,-50%);">FullSc</button>

</body>

<script>

    let startbutt=document.getElementById("startbut")
    let startsc=document.getElementById("startsc")
    let cake=document.getElementById("cake")
    let textbub=document.getElementById("textbubble")
    let text=document.getElementById("text")
    let cat=document.getElementById("cat")
    let cover=document.getElementById("cover")
    let camerabg=document.getElementById("cam")
    let shutter=document.getElementById("button")
    let hat=document.getElementById("hat")
    let bdt=document.getElementById("bday_text")

    let HappyBday=new Audio("https://files.catbox.moe/wtbql9.mp3");
    let cute_meow=new Audio("https://files.catbox.moe/5nmsv9.mp3");
    let deep_meow=new Audio("https://files.catbox.moe/aa07d5.mp3");
    let shutter_sound=new Audio("https://files.catbox.moe/yn2otg.mp3");
    let curtain_draw_sound=new Audio("https://files.catbox.moe/az8cri.mp3");

    var reached=false
    var isheld=false
    var touched=false
    var started=false
    var coverY=-2000
    var dropcam=false
    var camY=-2000

    var singing=false
    var textY=2000
    var capthere=false

    var meowed=false
    var textreached=false
    var phototaken=false
    var hatY=-1000

    var videoon=false

    function start(){started=true; document.documentElement.requestFullscreen(); startsc.remove(); startbutt.remove(); }

    startbutt.onclick=start

    function showdia(dialogue){if (!touched){textbub.style.opacity=1.0; text.style.opacity=1.0; text.innerText=dialogue; setTimeout(function(){showdia("I would love some cake"); setTimeout(function(){showdia("TAKE ME THERE!");setTimeout(function(){textbub.style.opacity=0; textbub.remove(); text.remove(); touched=true;},2000)},2000)},2000)}}

    function update(){

        if (started){setTimeout(function(){showdia("HEY!"); jump(); cute_meow.play()},2000); started=false}

        if (iscolliding(cat,cake) && !meowed){touched=false;reached=true;cat.style.backgroundImage="url('https://files.catbox.moe/l19sik.png')"; deep_meow.play(); meowed=true; curtain_draw_sound.play();}

        if (videoon){shutter.style.display="block"}
        else{shutter.style.display="none"}

        if (reached && coverY<0){coverY+=5;cover.style.top=coverY+"px"; dropcam=true; }
        else{curtain_draw_sound.pause()}

        if (dropcam && camY<300){camY+=5; cam.style.top=camY+"px";}

        if (phototaken && hatY<-30){hatY+=5; hat.style.top=hatY+"px"; capthere=true}

        if (capthere && textY>1350){textY-=5; bdt.style.top=textY+"px"; textreached=true}

        if (!singing && textreached){HappyBday.play(); singing=true}

        setTimeout(update,16)
    }

    update();

    camerabg.onclick=showpicture
    shutter.onclick=takepicture

    async function takepicture() {
if (videoon) { shutter_sound.play();
    let video = document.getElementById("camerafeed");
    let canvas = document.getElementById("photo");

    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;

    let ctx = canvas.getContext("2d");

    ctx.drawImage(video, 0, 0);

    canvas.style.position = "absolute";
    canvas.style.top = "50%";
    canvas.style.left = "50%";
    canvas.style.width = "70%";
    canvas.style.height = "50%";
    canvas.style.transform = "translate(-50%, -50%)";
    canvas.style.zIndex = "1000";

    camerabg.style.display="none"

    phototaken=true
    shutter.remove()
}

}

    async function showpicture(){
        if (!videoon){
            try {
                if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
                    alert("Cannot access camera");
                    return;
                }

                let video=document.getElementById("camerafeed");

                let stream=await navigator.mediaDevices.getUserMedia({
                    video:true,
                    audio:false
                });

                video.srcObject=stream;
                await video.play();

                videoon=true;

            } catch(error) {
                alert("Cannot access camera");
                console.log(error);
            }
        }
    }

    function jump(){
        let startY=cat.offsetTop;
        let height=100;
        let time=0;

        function animate(){time +=0.05;
            let y=startY-height*Math.sin(time*Math.PI);
            cat.style.top=y+"px";
            if (time<1){
                requestAnimationFrame(animate);
            } else {cat.style.top=startY+"px";}
        }
        animate()
    }

    cat.addEventListener("touchstart",function(e){e.preventDefault();});
    cat.addEventListener("touchmove",function(e){e.preventDefault();
        if (touched){
        let touch=e.touches[0];
        cat.style.left=touch.clientX-50+"px";
        cat.style.top=touch.clientY-50+"px";
        isheld=true
    }
    });

    cat.addEventListener("touchend", function(){isheld=false});

    function iscolliding(a,b){
        let A=a.getBoundingClientRect()
        let B=b.getBoundingClientRect()

        return A.left<B.right &&
        A.right>B.left &&
        A.top<B.bottom &&
        A.bottom>B.top;
    }

</script>

</html>
